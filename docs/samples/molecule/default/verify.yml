---
# Verify: validate the AI-generated playbook ran correctly
#
# Basic post-converge checks. Extend with assertions
# specific to your environment.

- name: Verify playbook execution
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Confirm converge completed without errors
      ansible.builtin.assert:
        that:
          - true
        success_msg: "Converge completed successfully"

