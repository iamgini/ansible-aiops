---
# Intelligent AIOps Workflow
#
# Orchestrates AI-powered incident remediation:
#   Play 1: Setup MCP connection (localhost) — skipped if skip_mcp=true
#   Play 2: Query AAP templates via MCP (aap_mcp host) — auto-skipped if no MCP host
#   Play 3: Score results → Launch job or AI generate → CaC
#
# AI Backends: "lightspeed" (default), "generic_api", or "coder"
# Skip MCP: -e "skip_mcp=true" or export SKIP_MCP=true

# =============================================================================
# Play 1: Setup MCP Connection
# =============================================================================
- name: Setup MCP Connection
  hosts: localhost
  gather_facts: false

  vars:
    skip_mcp: "{{ lookup('env', 'SKIP_MCP') | default(false, true) }}"

  tasks:
    - name: Initialize workflow state
      ansible.builtin.set_fact:
        skip_mcp: "{{ skip_mcp | bool }}"
        mcp_completed: false
        mcp_configured: false
        mcp_action: "not_started"
        mcp_score: 0

    # --- Event Parsing: detect source and normalize to standard event_* vars ---
    - name: Parse raw payload
      ansible.builtin.set_fact:
        raw_event: "{{ raw_payload | from_json if raw_payload is string else raw_payload }}"
      when: raw_payload is defined and raw_payload | length > 0

    - name: Detect event source
      ansible.builtin.set_fact:
        detected_source: >-
          {% if raw_event is defined and raw_event.alert_name is defined %}elastic
          {% elif raw_event is defined %}generic
          {% else %}none{% endif %}
      when: raw_event is defined

    - name: Parse event ({{ detected_source | default('preset') }})
      ansible.builtin.include_tasks: "event_parsers/{{ detected_source }}.yml"
      when:
        - raw_event is defined
        - detected_source is defined
        - detected_source | trim != 'none'

    - name: Event parsed
      ansible.builtin.debug:
        msg: "source={{ event_source | default('preset') }} type={{ event_type }} host={{ event_host }} severity={{ event_severity | default('') }}"
      when: event_type is defined

    # --- MCP Setup ---
    - name: MCP skipped by user
      ansible.builtin.debug:
        msg: "MCP skipped — proceeding to AI generation"
      when: skip_mcp | bool

    - name: Setup MCP connection
      ansible.builtin.include_role:
        name: internal.aiops.aiops_mcp_matcher
        tasks_from: setup.yml
      when: not (skip_mcp | bool)

# =============================================================================
# Play 2: Query AAP Templates via MCP
# =============================================================================
- name: Query AAP Templates via MCP
  hosts: aap_mcp
  gather_facts: false

  tasks:
    - name: Query templates via MCP
      ansible.builtin.include_role:
        name: internal.aiops.aiops_mcp_matcher
        tasks_from: query.yml
      when: hostvars['localhost']['mcp_configured'] | default(false)

# =============================================================================
# Play 3: Score, Launch, Generate, CaC
# =============================================================================
- name: Intelligent AIOps Workflow
  hosts: localhost
  gather_facts: false

  vars:
    ai_backend: "{{ lookup('env', 'AI_BACKEND') | default('generic_api', true) }}"

  tasks:
    - name: Execute MCP matcher role (scoring and launch)
      ansible.builtin.include_role:
        name: internal.aiops.aiops_mcp_matcher
      vars:
        event_type: "{{ event_type }}"
        event_description: "{{ event_description }}"
        event_host: "{{ event_host }}"
        event_severity: "{{ event_severity }}"
        event_service: "{{ event_service | default('') }}"
        event_tags: "{{ event_tags | default([]) }}"

    - name: Execute AI playbook generator role
      ansible.builtin.include_role:
        name: internal.aiops.aiops_playbook_generator
      vars:
        event_type: "{{ event_type }}"
        event_description: "{{ event_description }}"
        event_host: "{{ event_host }}"
        event_severity: "{{ event_severity }}"
        event_service: "{{ event_service | default('') }}"
        event_tags: "{{ event_tags | default([]) }}"
      when: not mcp_completed

    - name: Execute CaC Manager to create JT and Workflow in AAP
      ansible.builtin.include_role:
        name: internal.aiops.aiops_cac_manager
      vars:
        event_type: "{{ event_type }}"
        event_description: "{{ event_description }}"
        event_host: "{{ event_host }}"
        event_severity: "{{ event_severity }}"
        event_service: "{{ event_service | default('') }}"
      when:
        - not mcp_completed
        - ai_generation_completed | default(false)
        - ai_git_pushed | default(false)

    - name: Clean up MCP manifest
      ansible.builtin.file:
        path: "/tmp/aap-mcp-manifest.json"
        state: absent
      changed_when: false

    - name: Workflow Summary
      ansible.builtin.debug:
        msg: >-
          {{ 'MCP matched: ' + mcp_template_name + ' (score=' + (mcp_score | string) + ', job=' + (mcp_job_id | string) + ')'
             if mcp_completed else
             'AI Generated' +
             ' | branch=' + (ai_git_review_branch | default('N/A')) +
             ' | CaC JT=' + (cac_jt_name | default('N/A')) +
             ' WF=' + (cac_wf_name | default('N/A')) }}
