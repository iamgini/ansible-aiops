---
# Intelligent AIOps Workflow
#
# Orchestrates AI-powered incident remediation:
#   1. Query AAP via MCP → Launch job if found
#   2. Generate playbook with AI → Commit to git
#
# AI Backends: "lightspeed" (default), "generic_api", or "coder"
# See: docs/MODULAR-ARCHITECTURE.md

- name: Intelligent AIOps Workflow
  hosts: localhost
  gather_facts: false

  vars:
    ai_backend: "{{ lookup('env', 'AI_BACKEND') | default('lightspeed', true) }}"

  tasks:
    - name: Display workflow initiation
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Intelligent AIOps Workflow"
          - "=========================================="
          - "Event Type: {{ event_type }}"
          - "Description: {{ event_description }}"
          - "Host: {{ event_host }}"
          - "Severity: {{ event_severity }}"
          - "AI Backend: {{ ai_backend }}"
          - "=========================================="

    - name: Execute MCP matcher role
      ansible.builtin.include_role:
        name: aiops_mcp_matcher
      vars:
        event_type: "{{ event_type }}"
        event_description: "{{ event_description }}"
        event_host: "{{ event_host }}"
        event_severity: "{{ event_severity }}"
        event_service: "{{ event_service | default('') }}"
        event_tags: "{{ event_tags | default([]) }}"

    - name: Execute AI playbook generator role
      ansible.builtin.include_role:
        name: aiops_playbook_generator
      vars:
        event_type: "{{ event_type }}"
        event_description: "{{ event_description }}"
        event_host: "{{ event_host }}"
        event_severity: "{{ event_severity }}"
        event_service: "{{ event_service | default('') }}"
        event_tags: "{{ event_tags | default([]) }}"
        ai_backend: "{{ ai_backend }}"
      when: not mcp_completed

    - name: Execute CaC Manager to create JT and Workflow in AAP
      ansible.builtin.include_role:
        name: aiops_cac_manager
      vars:
        event_type: "{{ event_type }}"
        event_description: "{{ event_description }}"
        event_host: "{{ event_host }}"
        event_severity: "{{ event_severity }}"
        event_service: "{{ event_service | default('') }}"
      when:
        - not mcp_completed
        - ai_generation_completed | default(false)
        - ai_git_pushed | default(false)

    - name: Workflow Summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "✅ Intelligent AIOps Workflow Complete!"
          - "=========================================="
          - "Workflow Path: {{ 'MCP → AAP Job Launch' if mcp_completed else 'AI Generation (' + ai_backend + ') → Git Push' }}"
          - "{{ 'AAP Job Template: ' + mcp_template_name if mcp_completed else 'Generated Playbook: ' + git_playbook_dir + '/' + ai_playbook_filename }}"
          - "{{ 'MCP Score: ' + (mcp_score | string) if mcp_completed else 'AI Backend: ' + ai_backend_used }}"
          - "{{ 'Job ID: ' + (mcp_job_id | string) if mcp_completed else 'Git Pushed: ' + (ai_git_pushed | string) }}"
          - "{{ '' if mcp_completed else 'Review Branch: ' + (ai_git_review_branch | default('N/A')) }}"
          - "{{ '' if mcp_completed else 'CaC JT: ' + (cac_jt_name | default('N/A')) }}"
          - "{{ '' if mcp_completed else 'CaC WF: ' + (cac_wf_name | default('N/A')) }}"
          - "=========================================="
