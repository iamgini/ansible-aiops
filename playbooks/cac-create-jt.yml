---
# CaC: Create Job Template (post code review)
#
# Run this after reviewing and merging the AI-generated playbook to main.
# Creates a production JT in AAP pointing to the main branch — no workflow needed.
#
# Usage:
#   ansible-navigator run playbooks/cac-create-jt.yml -m stdout \
#     -e "event_type=disk_alert" \
#     -e "event_host=web-server-01" \
#     -e "ai_playbook_filename=disk_alert_web-server-01.yml"
#
# The JT uses the shared project with scm_branch=main (post-merge).
# Override with -e "cac_jt_scm_branch=some-branch" if needed.

- name: Create Job Template in AAP (post code review)
  hosts: localhost
  gather_facts: false

  vars:
    cac_create_workflow: false
    cac_jt_scm_branch: "{{ lookup('env', 'GIT_DEFAULT_BRANCH') | default('main', true) }}"

  tasks:
    # --- Event Parsing: detect source and normalize to standard event_* vars ---
    - name: Parse raw payload (JSON string)
      ansible.builtin.set_fact:
        raw_event: "{{ raw_payload | from_json }}"
      when: raw_payload is defined and raw_payload is string and raw_payload | length > 0

    - name: Parse raw payload (already parsed)
      ansible.builtin.set_fact:
        raw_event: "{{ raw_payload }}"
      when: raw_payload is defined and raw_payload is mapping

    - name: Detect event source
      ansible.builtin.set_fact:
        detected_source: "{% if raw_event.alert_name is defined %}elastic{% elif raw_event is defined %}generic{% else %}none{% endif %}"
      when: raw_event is defined

    - name: Parse event ({{ detected_source | default('preset') }})
      ansible.builtin.include_tasks: "event_parsers/{{ detected_source }}.yml"
      when:
        - raw_event is defined
        - detected_source is defined
        - detected_source | trim != 'none'

    - name: Event parsed
      ansible.builtin.debug:
        msg: "source={{ event_source | default('preset') }} type={{ event_type }} host={{ event_host }} severity={{ event_severity | default('') }}"
      when: event_type is defined

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - event_type is defined
          - event_host is defined
          - ai_playbook_filename is defined and ai_playbook_filename | length > 0
        fail_msg: "Required: event_type, event_host, ai_playbook_filename (passed from JT1 via set_stats or extra_vars)"

    - name: Create JT via CaC Manager
      ansible.builtin.include_role:
        name: internal.aiops.aiops_cac_manager
