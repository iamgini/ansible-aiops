---
# Recursive retry wrapper: generate → validate → retry with error feedback if failed
# Called from main.yml. Recurses until validation passes or ai_max_retries exhausted.

- name: "Generate attempt {{ ai_retry_count | int + 1 }}/{{ ai_max_retries | int }}"
  ansible.builtin.debug:
    msg: "Attempt {{ ai_retry_count | int + 1 }} | {{ 'Retrying with error feedback' if ai_validation_errors | default('') | length > 0 else 'First attempt' }}"

- name: Include Lightspeed backend tasks
  ansible.builtin.include_tasks: backend_lightspeed.yml
  when: ai_backend == 'lightspeed'

- name: Include Generic API backend tasks
  ansible.builtin.include_tasks: backend_generic_api.yml
  when: ai_backend == 'generic_api'

- name: Include Coder backend tasks
  ansible.builtin.include_tasks: backend_coder.yml
  when: ai_backend == 'coder'

- name: Increment retry counter
  ansible.builtin.set_fact:
    ai_retry_count: "{{ ai_retry_count | int + 1 }}"
  when: not (ai_validation_passed | default(false) | bool)

- name: Retry generation with error feedback
  ansible.builtin.include_tasks: generate_with_retry.yml
  when:
    - not (ai_validation_passed | default(false) | bool)
    - ai_retry_count | int < ai_max_retries | int
