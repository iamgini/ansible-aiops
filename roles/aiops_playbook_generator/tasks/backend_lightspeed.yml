---
# Backend: Lightspeed (Red Hat Automation Code Assistant API)

- name: Generate unique run ID for temp directory
  ansible.builtin.set_fact:
    run_id: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"

- name: Set temp clone directory path
  ansible.builtin.set_fact:
    temp_clone_dir: "/tmp/ansible-code-assistant-git-{{ run_id }}"

- name: Build Code Assistant prompt from event context
  ansible.builtin.set_fact:
    lightspeed_prompt: |
      Create an Ansible playbook to remediate the following issue:

      Event Type: {{ event_type }}
      Description: {{ event_description }}
      Target Host: {{ event_host }}
      Severity: {{ event_severity }}
      {% if event_service is defined and event_service | length > 0 %}Service: {{ event_service }}{% endif %}
      {% if event_tags is defined and event_tags | length > 0 %}Tags: {{ event_tags | join(', ') }}{% endif %}

      Requirements:
      - Use FQCN (Fully Qualified Collection Names)
      - Include error handling with block/rescue
      - Add descriptive task names
      - Use become: true where needed for privilege escalation
      - Target the host: {{ event_host }}
      - Make the playbook idempotent

- name: Generate playbook with Red Hat Code Assistant API
  ansible.builtin.uri:
    url: "{{ lightspeed_url }}"
    method: POST
    headers:
      Authorization: "Bearer {{ lightspeed_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      text: "{{ lightspeed_prompt }}"
    return_content: true
    status_code: 200
    timeout: 180
  register: lightspeed_response

- name: Display Code Assistant generation results
  ansible.builtin.debug:
    msg:
      - "Code Assistant Playbook Generation (Lightspeed):"
      - "Status: {{ 'Success' if lightspeed_response.status == 200 else 'Failed' }}"
      - "Playbook Length: {{ lightspeed_response.json.playbook | default(lightspeed_response.json.content | default('')) | length }} chars"

- name: Extract and validate generated playbook
  ansible.builtin.set_fact:
    playbook_content: "{{ lightspeed_response.json.playbook | default(lightspeed_response.json.content | default('')) }}"

- name: Validate generated playbook structure
  ansible.builtin.assert:
    that:
      - playbook_content is defined
      - playbook_content | length > 0
      - "'- name:' in playbook_content or '---' in playbook_content"
    fail_msg: "Generated playbook is invalid or empty"

- name: Generate playbook filename
  ansible.builtin.set_fact:
    playbook_filename: "{{ event_type }}_{{ event_host | regex_replace('\\.', '_') }}.yml"

- name: Clone git repository to temp directory
  ansible.builtin.git:
    repo: "https://{{ git_username }}:{{ git_token }}@{{ git_remote_url | regex_replace('https://', '') }}"
    dest: "{{ temp_clone_dir }}"
    version: main
    force: true
  when: git_token | length > 0
  no_log: true

- name: Create playbooks directory in cloned repo
  ansible.builtin.file:
    path: "{{ temp_clone_dir }}/playbooks"
    state: directory
    mode: '0755'
  when: git_token | length > 0

- name: Save generated playbook to cloned repo
  ansible.builtin.copy:
    content: "{{ playbook_content }}"
    dest: "{{ temp_clone_dir }}/playbooks/{{ playbook_filename }}"
    mode: '0644'
  when: git_token | length > 0

- name: Configure git user
  ansible.builtin.command:
    cmd: "git config user.name '{{ git_username }}'"
    chdir: "{{ temp_clone_dir }}"
  changed_when: false
  when: git_token | length > 0

- name: Configure git email
  ansible.builtin.command:
    cmd: "git config user.email '{{ git_email }}'"
    chdir: "{{ temp_clone_dir }}"
  changed_when: false
  when: git_token | length > 0

- name: Add and commit playbook
  ansible.builtin.command:
    cmd: >
      git add playbooks/{{ playbook_filename }} &&
      git commit -m "AI-generated playbook: {{ playbook_filename }}"
      -m "Event: {{ event_type }}"
      -m "Generated by Red Hat Automation Code Assistant via EDA"
    chdir: "{{ temp_clone_dir }}"
  register: git_commit
  changed_when: true
  when: git_token | length > 0

- name: Push to git repository
  ansible.builtin.command:
    cmd: "git push origin main"
    chdir: "{{ temp_clone_dir }}"
  when:
    - git_token | length > 0
    - git_commit.changed
  register: git_push

- name: Clean up temp directory
  ansible.builtin.file:
    path: "{{ temp_clone_dir }}"
    state: absent
  when: git_token | length > 0

- name: Set generation results
  ansible.builtin.set_fact:
    ai_generation_completed: true
    ai_backend_used: "lightspeed"
    ai_playbook_filename: "{{ playbook_filename }}"
    ai_git_pushed: "{{ git_push.rc == 0 if git_push is defined else false }}"
