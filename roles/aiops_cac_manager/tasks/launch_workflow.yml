---
# Launch the dynamically created workflow template

- name: Set workflow template name
  ansible.builtin.set_fact:
    wf_launch_name: "{{ aap_wf_prefix }}-{{ event_type }}-{{ event_host | regex_replace('\\.', '-') }}"

- name: Launch workflow template
  ansible.controller.workflow_launch:
    name: "{{ wf_launch_name }}"
    controller_host: "{{ aap_hostname }}"
    controller_oauthtoken: "{{ controller_oauthtoken }}"
    validate_certs: "{{ aap_validate_certs }}"
    extra_vars:
      event_type: "{{ event_type }}"
      event_host: "{{ event_host }}"
      event_severity: "{{ event_severity }}"
      event_description: "{{ event_description | default('AI-generated remediation') }}"
    wait: false
  register: wf_launch_result

- name: Display workflow launch result
  ansible.builtin.debug:
    msg:
      - "Workflow launched: {{ wf_launch_name }}"
      - "Job ID: {{ wf_launch_result.id | default('N/A') }}"
      - "Status: {{ wf_launch_result.status | default('launched') }}"

- name: Set launch results
  ansible.builtin.set_fact:
    cac_workflow_launched: true
    cac_workflow_job_id: "{{ wf_launch_result.id | default('') }}"
