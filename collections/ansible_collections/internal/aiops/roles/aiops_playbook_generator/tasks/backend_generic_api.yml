---
# Backend: Generic API (OpenAI-compatible chat completions endpoint)
# Works with: OpenAI, Azure OpenAI, vLLM, Ollama, LiteLLM, and other compatible APIs

- name: Build remediation prompt from event context
  ansible.builtin.set_fact:
    generation_prompt: |
      Create an Ansible playbook to remediate the following issue:

      Event Type: {{ event_type }}
      Description: {{ event_description }}
      Target Host: {{ event_host }}
      Severity: {{ event_severity }}
      {% if event_service is defined and event_service | length > 0 %}Service: {{ event_service }}{% endif %}
      {% if event_tags is defined and event_tags | length > 0 %}Tags: {{ event_tags | join(', ') }}{% endif %}

      Requirements:
      - Use FQCN (Fully Qualified Collection Names)
      - Include error handling with block/rescue
      - Add descriptive task names
      - Use become: true where needed for privilege escalation
      - Target the host: {{ event_host }}
      - Make the playbook idempotent
      - Return ONLY the YAML playbook content, no markdown fences or explanations
      {% if ai_validation_errors | default('') | length > 0 %}

      IMPORTANT: The previous attempt failed validation. Fix these errors:
      {{ ai_validation_errors }}
      {% endif %}

- name: Build API request headers
  ansible.builtin.set_fact:
    generic_api_headers:
      Content-Type: "application/json"
      Authorization: "Bearer {{ generic_api_token }}"
  no_log: true

- name: Remove Authorization header when no token provided
  ansible.builtin.set_fact:
    generic_api_headers:
      Content-Type: "application/json"
  when: generic_api_token | length == 0

- name: Generate playbook with OpenAI-compatible API
  ansible.builtin.uri:
    url: "{{ generic_api_url }}"
    method: POST
    headers: "{{ generic_api_headers }}"
    body_format: json
    body:
      model: "{{ generic_ai_model }}"
      messages:
        - role: "user"
          content: "{{ generation_prompt }}"
      temperature: 0.2
    return_content: true
    status_code: 200
    timeout: 180
  register: generic_api_response
  no_log: true

- name: Extract generated playbook content
  ansible.builtin.set_fact:
    raw_content: "{{ generic_api_response.json.choices[0].message.content }}"

- name: Strip markdown code fences if present
  ansible.builtin.set_fact:
    playbook_content: >-
      {{ raw_content | regex_replace('(?s)^```(yaml|yml|ansible)?\n', '') | regex_replace('\n```\s*$', '') }}

- name: Validate generated playbook structure
  ansible.builtin.assert:
    that:
      - playbook_content is defined
      - playbook_content | length > 0
      - "'- name:' in playbook_content or '---' in playbook_content"
    fail_msg: "Generated playbook is invalid or empty"

- name: Generate playbook filename
  ansible.builtin.set_fact:
    playbook_filename: "{{ event_type }}_{{ event_host | regex_replace('\\.', '_') }}.yml"

- name: Validate generated playbook
  ansible.builtin.include_tasks: validate_playbook.yml

- name: Push generated playbook to git
  ansible.builtin.include_tasks: git_push.yml
  when: ai_validation_passed | bool

- name: Set generation results
  ansible.builtin.set_fact:
    ai_generation_completed: "{{ ai_validation_passed | bool }}"
    ai_backend_used: "generic_api"
    ai_playbook_filename: "{{ playbook_filename }}"
