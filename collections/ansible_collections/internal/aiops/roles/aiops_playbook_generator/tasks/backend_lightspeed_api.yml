---
# Backend: Lightspeed (Red Hat Automation Code Assistant API)

- name: Build prompt from guardrails spec and event context
  ansible.builtin.include_tasks: build_prompt.yml

- name: Generate playbook with Red Hat Code Assistant API
  ansible.builtin.uri:
    url: "{{ lightspeed_url }}"
    method: POST
    headers:
      Authorization: "Bearer {{ lightspeed_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      text: "{{ generation_prompt }}"
    return_content: true
    status_code: 200
    timeout: 180
  register: lightspeed_response
  no_log: true

- name: Extract and validate generated playbook
  ansible.builtin.set_fact:
    playbook_content: "{{ lightspeed_response.json.playbook | default(lightspeed_response.json.content | default('')) }}"

- name: Validate generated playbook structure
  ansible.builtin.assert:
    that:
      - playbook_content is defined
      - playbook_content | length > 0
      - "'- name:' in playbook_content or '---' in playbook_content"
    fail_msg: "Generated playbook is invalid or empty"

- name: Generate playbook filename
  ansible.builtin.set_fact:
    playbook_filename: "{{ event_type | regex_replace('[^a-zA-Z0-9]', '_') }}_{{ event_host | regex_replace('[^a-zA-Z0-9]', '_') }}.yml"

- name: Validate generated playbook
  ansible.builtin.include_tasks: validate_playbook.yml
  when: not (ai_skip_validation | bool)

- name: Skip validation - mark as passed
  ansible.builtin.set_fact:
    ai_validation_passed: true
  when: ai_skip_validation | bool

- name: Push generated playbook to git
  ansible.builtin.include_tasks: git_push.yml
  when: ai_validation_passed | bool

- name: Set generation results
  ansible.builtin.set_fact:
    ai_generation_completed: "{{ ai_validation_passed | bool }}"
    ai_backend_used: "lightspeed_api"
    ai_playbook_filename: "{{ playbook_filename }}"
