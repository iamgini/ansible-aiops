---
# Clone repo, create review branch, commit generated playbook, push
# Uses ansible.scm collection for clean git operations
# Requires: playbook_content, playbook_filename

- name: Generate unique run ID
  ansible.builtin.set_fact:
    run_id: "{{ lookup('pipe', 'date +%H%M%S') }}"

- name: Set review branch name
  ansible.builtin.set_fact:
    git_review_branch: "{{ git_review_branch_prefix }}/{{ event_type | lower | regex_replace('[^a-z0-9]', '-') }}-{{ run_id }}"

- name: Retrieve repository and create review branch
  ansible.scm.git_retrieve:
    origin:
      url: "{{ git_remote_url }}"
      token: "{{ git_token }}"
    branch:
      name: "{{ git_review_branch }}"
      duplicate_detection: false
    host_key_checking: "{{ 'yes' if git_ssl_verify | bool else 'no' }}"
    timeout: 60
  register: repository
  when: git_token | length > 0

- name: Create playbook directory in cloned repo
  ansible.builtin.file:
    path: "{{ repository.path }}/{{ git_playbook_dir }}"
    state: directory
    mode: '0755'
  when: git_token | length > 0

- name: Save generated playbook to cloned repo
  ansible.builtin.copy:
    content: "{{ playbook_content }}"
    dest: "{{ repository.path }}/{{ git_playbook_dir }}/{{ playbook_filename }}"
    mode: '0644'
  when: git_token | length > 0

- name: Publish changes to remote
  ansible.scm.git_publish:
    path: "{{ repository.path }}"
    token: "{{ git_token }}"
    commit:
      message: "AI-generated playbook: {{ playbook_filename }} [{{ event_type }}]"
    user:
      name: "{{ git_commit_author }}"
      email: "{{ git_email }}"
    include:
      - "{{ git_playbook_dir }}/{{ playbook_filename }}"
    remove: true
    timeout: 60
  register: git_push
  when: git_token | length > 0

- name: Set git push results
  ansible.builtin.set_fact:
    ai_git_pushed: "{{ git_push is defined and git_push is not failed }}"
    ai_git_review_branch: "{{ git_review_branch }}"
