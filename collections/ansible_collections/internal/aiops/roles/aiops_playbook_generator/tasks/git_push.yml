---
# Shared: Clone repo, create review branch, commit generated playbook, push
# Requires: playbook_content, playbook_filename
# Uses variables from defaults/main.yml: git_remote_url, git_token, git_username,
#   git_email, git_default_branch, git_review_branch_prefix, git_playbook_dir,
#   git_commit_author, git_ssl_verify

- name: Generate unique run ID
  ansible.builtin.set_fact:
    run_id: "{{ lookup('pipe', 'date +%H%M%S') }}"

- name: Set temp clone directory and review branch name
  ansible.builtin.set_fact:
    temp_clone_dir: "/tmp/ansible-aiops-git-{{ run_id }}"
    git_review_branch: "{{ git_review_branch_prefix }}/{{ event_type | lower | regex_replace('[^a-z0-9]', '-') }}-{{ run_id }}"

- name: Build authenticated git URL
  ansible.builtin.set_fact:
    git_auth_url: "https://{{ git_username }}:{{ git_token }}@{{ git_remote_url | regex_replace('https://', '') }}"
  no_log: true

- name: Disable SSL verification if configured
  ansible.builtin.command:
    cmd: "git config --global http.sslVerify false"
  changed_when: false
  when: not (git_ssl_verify | bool)

- name: Clone default branch from remote
  ansible.builtin.git:
    repo: "{{ git_auth_url }}"
    dest: "{{ temp_clone_dir }}"
    version: "{{ git_default_branch }}"
    force: true
  when: git_token | length > 0
  no_log: true

- name: Pull latest changes from default branch
  ansible.builtin.command:
    cmd: "git pull origin {{ git_default_branch }}"
    chdir: "{{ temp_clone_dir }}"
  changed_when: false
  when: git_token | length > 0

- name: Create and switch to review branch
  ansible.builtin.command:
    cmd: "git checkout -b {{ git_review_branch }}"
    chdir: "{{ temp_clone_dir }}"
  changed_when: true
  when: git_token | length > 0

- name: Create playbook directory in cloned repo
  ansible.builtin.file:
    path: "{{ temp_clone_dir }}/{{ git_playbook_dir }}"
    state: directory
    mode: '0755'
  when: git_token | length > 0

- name: Save generated playbook to cloned repo
  ansible.builtin.copy:
    content: "{{ playbook_content }}"
    dest: "{{ temp_clone_dir }}/{{ git_playbook_dir }}/{{ playbook_filename }}"
    mode: '0644'
  when: git_token | length > 0

- name: Configure git user name
  ansible.builtin.command:
    cmd: "git config user.name '{{ git_commit_author }}'"
    chdir: "{{ temp_clone_dir }}"
  changed_when: false
  when: git_token | length > 0

- name: Configure git user email
  ansible.builtin.command:
    cmd: "git config user.email '{{ git_email }}'"
    chdir: "{{ temp_clone_dir }}"
  changed_when: false
  when: git_token | length > 0

- name: Stage generated playbook
  ansible.builtin.command:
    cmd: "git add {{ git_playbook_dir }}/{{ playbook_filename }}"
    chdir: "{{ temp_clone_dir }}"
  changed_when: true
  when: git_token | length > 0

- name: Commit generated playbook
  ansible.builtin.command:
    cmd: >
      git commit
      -m "AI-generated playbook: {{ playbook_filename }}"
      -m "Event: {{ event_type }}"
      -m "Host: {{ event_host }}"
      -m "Severity: {{ event_severity }}"
      -m "Backend: {{ ai_backend }}"
      -m "Generated by {{ git_commit_author }} via EDA"
    chdir: "{{ temp_clone_dir }}"
  register: git_commit
  changed_when: true
  when: git_token | length > 0

- name: Push review branch to remote
  ansible.builtin.command:
    cmd: "git push origin {{ git_review_branch }}"
    chdir: "{{ temp_clone_dir }}"
  when:
    - git_token | length > 0
    - git_commit.changed
  register: git_push

- name: Clean up temp directory
  ansible.builtin.file:
    path: "{{ temp_clone_dir }}"
    state: absent
  when: git_token | length > 0

- name: Re-enable SSL verification if it was disabled
  ansible.builtin.command:
    cmd: "git config --global http.sslVerify true"
  changed_when: false
  when: not (git_ssl_verify | bool)

- name: Set git push results
  ansible.builtin.set_fact:
    ai_git_pushed: "{{ git_push.rc == 0 if git_push is defined else false }}"
    ai_git_review_branch: "{{ git_review_branch }}"
