---
# Role: aiops_playbook_generator
# Generate Ansible playbooks using AI (pluggable backend: Lightspeed, Generic API, or Coder)

- name: Validate AI backend selection
  ansible.builtin.assert:
    that:
      - ai_backend in ['generic_api', 'lightspeed_api', 'coder_api']
    fail_msg: "Invalid ai_backend: {{ ai_backend }}. Must be 'generic_api', 'lightspeed_api', or 'coder_api'"

- name: Initialize retry state
  ansible.builtin.set_fact:
    ai_retry_count: 0
    ai_validation_passed: false
    ai_validation_errors: ""

- name: Generate playbook with validation retry
  ansible.builtin.include_tasks: generate_with_retry.yml

- name: Fail if all retries exhausted
  ansible.builtin.fail:
    msg: "AI generation failed after {{ ai_max_retries }} attempts. Last errors: {{ ai_validation_errors }}"
  when: not (ai_validation_passed | bool)

- name: Run AI review on generated playbook
  ansible.builtin.include_tasks: ai_review.yml
  when:
    - ai_review_enabled | bool
    - ai_validation_passed | bool
    - ai_git_pushed | default(false) | bool

- name: AI Playbook Generator Summary
  ansible.builtin.debug:
    msg: "Backend: {{ ai_backend_used }} | Playbook: {{ git_playbook_dir }}/{{ ai_playbook_filename }} | Validation: {{ 'skipped' if ai_skip_validation | bool else 'passed' }} | Git: pushed={{ ai_git_pushed }} branch={{ ai_git_review_branch | default('N/A') }}{{ ' | Review: branch=' + ai_review_branch_name if ai_review_pushed | default(false) else '' }}"
