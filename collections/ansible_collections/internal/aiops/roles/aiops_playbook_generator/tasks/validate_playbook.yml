---
# Validate AI-generated playbook: YAML lint, syntax check, ansible-lint
# Requires: playbook_content, playbook_filename
# Runs inside EE container — tools may or may not be available

- name: Create temp directory for validation
  ansible.builtin.tempfile:
    state: directory
    prefix: aiops-validate-
  register: validate_temp_dir

- name: Write playbook to temp file for validation
  ansible.builtin.copy:
    content: "{{ playbook_content }}"
    dest: "{{ validate_temp_dir.path }}/{{ playbook_filename }}"
    mode: '0644'

- name: Check if yamllint is available
  ansible.builtin.command:
    cmd: yamllint --version
  register: yamllint_check
  changed_when: false
  failed_when: false

- name: Run yamllint on generated playbook
  ansible.builtin.command:
    cmd: "yamllint -d relaxed {{ validate_temp_dir.path }}/{{ playbook_filename }}"
  register: yamllint_result
  changed_when: false
  failed_when: false
  when: yamllint_check.rc == 0

- name: Run ansible-playbook syntax check
  ansible.builtin.command:
    cmd: "ansible-playbook {{ validate_temp_dir.path }}/{{ playbook_filename }} --syntax-check -i localhost,"
  register: syntax_check_result
  changed_when: false
  failed_when: false

- name: Check if ansible-lint is available
  ansible.builtin.command:
    cmd: ansible-lint --version
  register: ansiblelint_check
  changed_when: false
  failed_when: false

- name: Run ansible-lint on generated playbook
  ansible.builtin.command:
    cmd: "ansible-lint -x yaml {{ validate_temp_dir.path }}/{{ playbook_filename }}"
  register: ansiblelint_result
  changed_when: false
  failed_when: false
  when: ansiblelint_check.rc == 0

- name: Collect validation errors
  ansible.builtin.set_fact:
    _validation_errors: >-
      {% set errors = [] %}
      {% if syntax_check_result.rc != 0 %}
        {% set _ = errors.append('SYNTAX ERROR: ' + syntax_check_result.stderr | default(syntax_check_result.stdout | default(''))) %}
      {% endif %}
      {% if yamllint_check.rc == 0 and yamllint_result.rc != 0 %}
        {% set _ = errors.append('YAMLLINT: ' + yamllint_result.stdout | default('')) %}
      {% endif %}
      {% if ansiblelint_check.rc == 0 and ansiblelint_result.rc != 0 %}
        {% set _ = errors.append('ANSIBLE-LINT: ' + ansiblelint_result.stdout | default('')) %}
      {% endif %}
      {{ errors | join('\n') }}

- name: Set validation results
  ansible.builtin.set_fact:
    ai_validation_syntax: "{{ syntax_check_result.rc == 0 }}"
    ai_validation_yamllint: "{{ yamllint_result.rc == 0 if yamllint_check.rc == 0 else 'skipped' }}"
    ai_validation_ansiblelint: "{{ ansiblelint_result.rc == 0 if ansiblelint_check.rc == 0 else 'skipped' }}"
    ai_validation_passed: "{{ syntax_check_result.rc == 0 }}"
    ai_validation_errors: "{{ _validation_errors | trim }}"

- name: Clean up temp validation directory
  ansible.builtin.file:
    path: "{{ validate_temp_dir.path }}"
    state: absent
