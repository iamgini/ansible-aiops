---
# Default variables for aiops_playbook_generator role

# AI Backend Selection
ai_backend: "generic_api"  # Options: "generic_api" (default), "lightspeed_api", or "coder_api"

# Validation and retry
ai_skip_validation: "{{ lookup('env', 'AI_SKIP_VALIDATION') | default(true, true) }}"
ai_max_retries: 3

# Git Repository Configuration
git_remote_url: "{{ lookup('env', 'GIT_REMOTE_URL') | default('https://github.com/iamgini/ansible-ai-generated-playbooks.git', true) }}"
git_token: "{{ lookup('env', 'GIT_TOKEN') | default('', true) }}"
git_username: "{{ lookup('env', 'GIT_USERNAME') | default('aiops-bot', true) }}"
git_email: "{{ lookup('env', 'GIT_EMAIL') | default('aiops@example.com', true) }}"
git_default_branch: "{{ lookup('env', 'GIT_DEFAULT_BRANCH') | default('main', true) }}"
git_review_branch_prefix: "{{ lookup('env', 'GIT_REVIEW_BRANCH_PREFIX') | default('aiops', true) }}"
git_playbook_dir: "{{ lookup('env', 'GIT_PLAYBOOK_DIR') | default('playbooks', true) }}"
git_commit_author: "{{ lookup('env', 'GIT_COMMIT_AUTHOR') | default('AIOps Playbook Generator', true) }}"
git_ssl_verify: "{{ lookup('env', 'GIT_SSL_VERIFY') | default('true', true) }}"

# Lightspeed/API Backend Configuration
lightspeed_url: "{{ lookup('env', 'LIGHTSPEED_URL') | default('http://localhost:8000/api/v0/ai/generations/', true) }}"
lightspeed_token: "{{ lookup('env', 'LIGHTSPEED_TOKEN') | default(lookup('env', 'AAP_BEARER_TOKEN'), true) }}"

# Generic API Backend Configuration (OpenAI-compatible)
generic_api_url: "{{ lookup('env', 'GENERIC_AI_API_URL') | default('http://localhost:11434/v1/chat/completions', true) }}"
generic_api_token: "{{ lookup('env', 'GENERIC_AI_API_TOKEN') | default('', true) }}"
generic_ai_model: "{{ lookup('env', 'GENERIC_AI_MODEL') | default('gpt-4', true) }}"
generic_api_validate_certs: "{{ lookup('env', 'GENERIC_AI_VALIDATE_CERTS') | default(false, true) }}"

# Coder Backend Configuration
coder_url: "{{ lookup('env', 'CODER_URL') | default('https://coder.example.com', true) }}"
coder_template_name: "ansible-remediation"
workspace_timeout: 600  # 10 minutes
auto_cleanup_workspace: true

# AI Review Step
# When enabled, a second AI pass reviews the generated playbook and pushes
# an improved version to <branch>_review for human comparison.
ai_review_enabled: "{{ lookup('env', 'AI_REVIEW_ENABLED') | default(false, true) }}"
ai_review_model: "{{ lookup('env', 'AI_REVIEW_MODEL') | default(generic_ai_model, true) }}"
ai_review_api_url: "{{ lookup('env', 'AI_REVIEW_API_URL') | default(generic_api_url, true) }}"
ai_review_api_token: "{{ lookup('env', 'AI_REVIEW_API_TOKEN') | default(generic_api_token, true) }}"
ai_review_validate_certs: "{{ lookup('env', 'AI_REVIEW_VALIDATE_CERTS') | default(generic_api_validate_certs, true) }}"

# SpecDD Guardrails
# Path to the .sdd spec file that defines safety rules for AI-generated playbooks.
# The spec's Must/Must-not/Forbids sections are injected into the LLM prompt.
# Override to point to a custom org-specific guardrails file.
guardrails_spec_path: ""  # empty = use role's built-in files/remediation-guardrails.sdd

# Event Context (passed from parent playbook)
# event_type: ""
# event_description: ""
# event_host: ""
# event_severity: ""
# event_service: ""
# event_tags: []
