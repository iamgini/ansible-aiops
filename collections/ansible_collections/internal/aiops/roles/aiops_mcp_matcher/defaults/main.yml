---
# Default variables for aiops_mcp_matcher role
#
# This role handles: MCP setup, MCP query, scoring, and job launch.
# Playbook calls tasks_from: setup.yml, query.yml, or main.yml (scoring).

# MCP Connection Configuration
skip_mcp: "{{ lookup('env', 'SKIP_MCP') | default(false, true) }}"
mcp_server_url: "{{ lookup('env', 'AAP_MCP_SERVER_URL') | default('', true) }}"
mcp_bearer_token: "{{ lookup('env', 'AAP_BEARER_TOKEN') | default(lookup('env', 'MCP_BEARER_TOKEN'), true) | default('', true) }}"
mcp_server_name: "aap"
mcp_manifest_dir: "/tmp"
mcp_verify_ssl: false

# MCP Query Configuration
mcp_tool_name: "job_templates_list"
mcp_tool_page_size: 200

# Role Output Variables (set to safe defaults)
mcp_completed: false
mcp_action: "not_started"
mcp_score: 0

# MCP Matching Thresholds
mcp_confidence_threshold: 100
mcp_minimum_score: 50

# LLM-based matching (optional — falls back to Jinja scoring when false)
mcp_match_using_llm: "{{ lookup('env', 'MCP_MATCH_USING_LLM') | default(true, true) }}"
llm_api_url: "{{ lookup('env', 'GENERIC_AI_API_URL') | default('http://localhost:11434/v1/chat/completions', true) }}"
llm_api_token: "{{ lookup('env', 'GENERIC_AI_API_TOKEN') | default('', true) }}"
llm_model: "{{ lookup('env', 'GENERIC_AI_MODEL') | default('gpt-4', true) }}"
llm_validate_certs: "{{ lookup('env', 'GENERIC_AI_VALIDATE_CERTS') | default(false, true) }}"

# AAP Controller Configuration (for job launch)
controller_host: "{{ lookup('env', 'CONTROLLER_HOST') | default('', true) }}"
controller_username: "{{ lookup('env', 'CONTROLLER_USERNAME') | default('', true) }}"
controller_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') | default('', true) }}"
controller_verify_ssl: false
