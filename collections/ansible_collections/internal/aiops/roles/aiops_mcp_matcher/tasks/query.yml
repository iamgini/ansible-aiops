- name: Query all job templates from AAP via MCP
  ansible.mcp.run_tool:
    name: "{{ mcp_tool_name }}"
    args:
      page_size: "{{ mcp_tool_page_size }}"
  register: job_templates_raw

- name: Store MCP response on localhost
  ansible.builtin.set_fact:
    _mcp_raw_response: "{{ job_templates_raw.content[0].text }}"
  delegate_to: localhost
  delegate_facts: true
  when:
    - job_templates_raw.content is defined
    - job_templates_raw.content | length > 0

- name: Templates retrieved
  ansible.builtin.debug:
    msg: "{{ (hostvars['localhost']['_mcp_raw_response'].results | default([])) | length }} templates found via MCP"
  when: hostvars['localhost']['_mcp_raw_response'] is defined
