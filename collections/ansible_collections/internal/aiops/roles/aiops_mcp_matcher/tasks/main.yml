---
# Role: aiops_mcp_matcher
# Score AAP job templates (from MCP query) against event attributes, launch best match
#
# Matching modes:
#   mcp_match_using_llm=false (default): Jinja weighted scoring
#   mcp_match_using_llm=true: Send trimmed templates + event to LLM API
#
# Expects `all_job_templates` to be set by the calling playbook (via MCP query in a separate play).
# If not set or empty, sets mcp_completed=false so the workflow falls through to AI generation.

- name: Parse MCP templates from raw response
  ansible.builtin.set_fact:
    all_job_templates: "{{ _mcp_raw_response.results | default([]) }}"
  when: _mcp_raw_response is defined

- name: Fallback to AAP REST API when MCP templates unavailable
  ansible.builtin.include_tasks: query_api.yml
  when:
    - mcp_api_fallback | bool
    - all_job_templates is not defined or all_job_templates | length == 0
    - controller_oauthtoken | default('') | length > 0

- name: Check if templates were retrieved
  ansible.builtin.set_fact:
    mcp_completed: false
    mcp_action: "no_templates"
    mcp_score: 0
  when: all_job_templates is not defined or all_job_templates | length == 0

- name: Templates available for scoring
  ansible.builtin.debug:
    msg: "{{ all_job_templates | length }} templates to score (method={{ 'llm' if mcp_match_using_llm | bool else 'jinja' }}) for event_type={{ event_type }}"
  when: all_job_templates is defined and all_job_templates | length > 0

# --- Matching ---

- name: Match templates using LLM
  ansible.builtin.include_tasks: llm_match.yml
  when:
    - mcp_match_using_llm | bool
    - all_job_templates is defined
    - all_job_templates | length > 0

- name: Match templates using Jinja scoring
  ansible.builtin.include_tasks: jinja_match.yml
  when:
    - not (mcp_match_using_llm | bool)
    - all_job_templates is defined
    - all_job_templates | length > 0

# --- Launch or Report ---

- name: Launch AAP job template (high confidence match)
  ansible.controller.job_launch:
    controller_host: "{{ controller_host }}"
    controller_oauthtoken: "{{ controller_oauthtoken }}"
    validate_certs: "{{ controller_verify_ssl }}"
    job_template: "{{ best_match.name }}"
    limit: "{{ event_host }}"
    extra_vars:
      event_type: "{{ event_type }}"
      event_severity: "{{ event_severity }}"
  register: aap_job
  when:
    - best_match is defined
    - best_match.score | int >= mcp_confidence_threshold | int

- name: Set MCP completion status - Job launched
  ansible.builtin.set_fact:
    mcp_completed: true
    mcp_action: "aap_job_launched"
    mcp_job_id: "{{ aap_job.id }}"
    mcp_template_name: "{{ best_match.name }}"
    mcp_score: "{{ best_match.score }}"
  when:
    - best_match is defined
    - best_match.score | int >= mcp_confidence_threshold | int
    - aap_job is defined

- name: Set MCP completion status - No match or low score
  ansible.builtin.set_fact:
    mcp_completed: false
    mcp_action: "no_match"
    mcp_score: "{{ best_match.score | default(0) }}"
  when: >
    best_match is not defined or
    best_match.score | int < mcp_confidence_threshold | int

- name: MCP Matcher Summary
  ansible.builtin.debug:
    msg: >-
      {{ 'Matched: ' + mcp_template_name + ' (score=' + (mcp_score | string) + ', job=' + (mcp_job_id | string) + ')'
         if mcp_completed else
         'No match (score=' + (mcp_score | string) + ') → AI generation' }}
