---
# Authenticate to AAP: use bearer token if available, else username/password

- name: Use bearer token for authentication
  ansible.builtin.set_fact:
    aap_oauthtoken: "{{ aap_bearer_token }}"
    controller_oauthtoken: "{{ aap_bearer_token }}"
  no_log: true
  when:
    - aap_oauthtoken is not defined
    - aap_bearer_token | length > 0

- name: Get AAP OAuth2 token via basic auth
  ansible.builtin.uri:
    url: "{{ aap_hostname }}/api/gateway/v1/tokens/"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    method: POST
    force_basic_auth: true
    validate_certs: "{{ aap_validate_certs }}"
    status_code: 201
  register: authtoken_res
  when:
    - aap_oauthtoken is not defined
    - aap_bearer_token | length == 0

- name: Set OAuth token from basic auth response
  ansible.builtin.set_fact:
    aap_oauthtoken: "{{ authtoken_res.json.token }}"
    aap_oauthtoken_url: "{{ authtoken_res.json.url }}"
    controller_oauthtoken: "{{ authtoken_res.json.token }}"
  no_log: true
  when:
    - authtoken_res is defined
    - authtoken_res is not skipped
