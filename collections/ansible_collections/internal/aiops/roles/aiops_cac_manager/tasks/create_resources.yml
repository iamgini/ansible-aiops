---
# Create AAP resources using ansible.controller modules directly
# Shared project (branch override) + per-event JT + per-event WF (approval → run)

- name: Build resource names
  ansible.builtin.set_fact:
    jt_name: "{{ aap_jt_prefix }}-{{ event_type }}-{{ event_host | regex_replace('\\.', '-') }}"
    wf_name: "{{ aap_wf_prefix }}-{{ event_type }}-{{ event_host | regex_replace('\\.', '-') }}"

- name: Create or update shared project
  ansible.controller.project:
    controller_host: "{{ aap_hostname }}"
    controller_oauthtoken: "{{ controller_oauthtoken }}"
    validate_certs: "{{ aap_validate_certs }}"
    name: "{{ aap_project }}"
    description: "AI-generated remediation playbooks - managed by AIOps"
    scm_type: git
    scm_url: "{{ git_remote_url }}"
    scm_branch: "{{ git_default_branch }}"
    scm_clean: true
    scm_update_on_launch: true
    allow_override: true
    credential: "{{ aap_scm_credential }}"
    organization: "{{ aap_organization }}"
    wait: true
    update_project: true
    state: present

- name: Create job template with branch override
  ansible.controller.job_template:
    controller_host: "{{ aap_hostname }}"
    controller_oauthtoken: "{{ controller_oauthtoken }}"
    validate_certs: "{{ aap_validate_certs }}"
    name: "{{ jt_name }}"
    description: "AI-generated remediation for {{ event_type }} on {{ event_host }}"
    job_type: run
    inventory: "{{ aap_inventory }}"
    project: "{{ aap_project }}"
    playbook: "{{ git_playbook_dir }}/{{ ai_playbook_filename }}"
    scm_branch: "{{ ai_git_review_branch }}"
    credentials:
      - "{{ aap_machine_credential }}"
    ask_limit_on_launch: true
    ask_variables_on_launch: true
    organization: "{{ aap_organization }}"
    state: present

- name: Create workflow template
  ansible.controller.workflow_job_template:
    controller_host: "{{ aap_hostname }}"
    controller_oauthtoken: "{{ controller_oauthtoken }}"
    validate_certs: "{{ aap_validate_certs }}"
    name: "{{ wf_name }}"
    description: "Approval + remediation for {{ event_type }} on {{ event_host }}"
    organization: "{{ aap_organization }}"
    ask_variables_on_launch: true
    state: present

- name: Add approval node
  ansible.controller.workflow_job_template_node:
    controller_host: "{{ aap_hostname }}"
    controller_oauthtoken: "{{ controller_oauthtoken }}"
    validate_certs: "{{ aap_validate_certs }}"
    workflow_job_template: "{{ wf_name }}"
    identifier: approve
    approval_node:
      name: "Approve: {{ event_type }} on {{ event_host }}"
      timeout: "{{ aap_approval_timeout }}"
    state: present

- name: Add run node
  ansible.controller.workflow_job_template_node:
    controller_host: "{{ aap_hostname }}"
    controller_oauthtoken: "{{ controller_oauthtoken }}"
    validate_certs: "{{ aap_validate_certs }}"
    workflow_job_template: "{{ wf_name }}"
    identifier: run
    unified_job_template: "{{ jt_name }}"
    organization: "{{ aap_organization }}"
    state: present

- name: Link approval to run on success
  ansible.controller.workflow_job_template_node:
    controller_host: "{{ aap_hostname }}"
    controller_oauthtoken: "{{ controller_oauthtoken }}"
    validate_certs: "{{ aap_validate_certs }}"
    workflow_job_template: "{{ wf_name }}"
    identifier: approve
    success_nodes:
      - run
    state: present
