---
# Default variables for aiops_cac_manager role
# Dynamically creates AAP Job Templates and Workflow Templates for AI-generated playbooks

# AAP Connection (bearer token preferred, falls back to username/password)
aap_bearer_token: "{{ lookup('env', 'AAP_BEARER_TOKEN') | default(lookup('env', 'MCP_BEARER_TOKEN'), true) | default('', true) }}"
aap_hostname: "{{ lookup('env', 'CONTROLLER_HOST') | default(lookup('env', 'AAP_MCP_SERVER_URL') | default('') | urlsplit('scheme') + '://' + lookup('env', 'AAP_MCP_SERVER_URL') | default('https://aap.example.com') | urlsplit('hostname'), true) }}"
aap_username: "{{ lookup('env', 'CONTROLLER_USERNAME') | default('admin', true) }}"
aap_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') | default('', true) }}"
aap_validate_certs: "{{ lookup('env', 'CONTROLLER_VERIFY_SSL') | default('false', true) }}"

# AAP Organization
aap_organization: "{{ lookup('env', 'AAP_ORGANIZATION') | default('Default', true) }}"

# AAP Project (must point to the AI-generated playbooks repo)
aap_project: "{{ lookup('env', 'AAP_AI_PROJECT') | default('AIOps-AI-Generated-Playbooks', true) }}"

# AAP Inventory (target hosts for remediation)
aap_inventory: "{{ lookup('env', 'AAP_INVENTORY') | default('Cac-Demo-Inventory', true) }}"

# AAP Credentials
aap_machine_credential: "{{ lookup('env', 'AAP_MACHINE_CREDENTIAL') | default('AIOps-Machine-Credential', true) }}"
aap_scm_credential: "{{ lookup('env', 'AAP_SCM_CREDENTIAL') | default('AIOps-SCM-Credential', true) }}"

# Dynamic Naming Prefixes
aap_jt_prefix: "{{ lookup('env', 'AAP_JT_PREFIX') | default('AIOps-AI', true) }}"
aap_wf_prefix: "{{ lookup('env', 'AAP_WF_PREFIX') | default('AIOps-WF-AI', true) }}"

# Approval Node
aap_approval_timeout: "{{ lookup('env', 'AAP_APPROVAL_TIMEOUT') | default(3600, true) }}"

# Labels applied to dynamically created JTs and WFs
aap_default_labels:
  - AIOps
  - ai-generated

# Workflow auto-launch after creation
aap_auto_launch_workflow: "{{ lookup('env', 'AAP_AUTO_LAUNCH_WORKFLOW') | default('false', true) }}"

# Project sync before creating JT (ensures AAP sees the merged playbook)
aap_sync_project: "{{ lookup('env', 'AAP_SYNC_PROJECT') | default('true', true) }}"

# Temp directory for rendered CaC templates
aap_cac_temp_dir: "/tmp/aiops-cac-{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"
