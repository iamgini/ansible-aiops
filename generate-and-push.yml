---
- name: Generate Playbook with Red Hat Code Assistant and Push to Git
  hosts: localhost
  gather_facts: false

  vars:
    # Red Hat Code Assistant (Lightspeed) API
    lightspeed_url: "{{ lookup('env', 'LIGHTSPEED_URL') | default('http://localhost:8000/api/v0/ai/generations/', true) }}"
    lightspeed_token: "{{ lookup('env', 'LIGHTSPEED_TOKEN') | default(lookup('env', 'AAP_BEARER_TOKEN'), true) }}"

    # Event details
    # event_type: "disk_full"
    # event_description: "Disk usage at 95% on /var/log partition"
    # target_host: "web-server-01.example.com"
    # event_severity: "high"

    # Event details #2 sample
    event_type: "nginx service stopped"
    event_description: "Nginx service not working"
    target_host: "web-server-02.example.com"
    event_severity: "high"

    # Git configuration
    git_remote_url: "https://github.com/your_username/your-ai-generated-playbooks-repo"
    git_token: "{{ lookup('env', 'GIT_TOKEN') }}"
    git_username: "{{ lookup('env', 'GIT_USERNAME') | default('your_github_username', true) }}"
    git_email: "{{ lookup('env', 'GIT_EMAIL') | default('your_email@example.com', true) }}"
    git_branch: "main"  # or create dynamic branch: "ai-{{ event_type }}-{{ run_id }}"

  tasks:
    - name: Generate unique run ID for temp directory
      ansible.builtin.set_fact:
        run_id: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"
      run_once: true

    - name: Set temp clone directory path
      ansible.builtin.set_fact:
        temp_clone_dir: "/tmp/ansible-code-assistant-git-{{ run_id }}"

    - name: Build Code Assistant prompt from event context
      ansible.builtin.set_fact:
        lightspeed_prompt: |
          Create an Ansible playbook to remediate the following issue:

          Event Type: {{ event_type }}
          Description: {{ event_description }}
          Target Host: {{ target_host }}
          Severity: {{ event_severity }}

          Requirements:
          - Use FQCN (Fully Qualified Collection Names)
          - Include error handling with block/rescue
          - Add descriptive task names
          - Use become: true where needed for privilege escalation
          - Target the host: {{ target_host }}
          - Make the playbook idempotent

    - name: Generate playbook with Red Hat Code Assistant
      ansible.builtin.uri:
        url: "{{ lightspeed_url }}"
        method: POST
        headers:
          Authorization: "Bearer {{ lightspeed_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          text: "{{ lightspeed_prompt }}"
        return_content: true
        status_code: 200
        timeout: 180
      register: lightspeed_response

    - name: Extract and validate generated playbook
      ansible.builtin.set_fact:
        playbook_content: "{{ lightspeed_response.json.playbook | default(lightspeed_response.json.content | default('')) }}"

    - name: Validate generated playbook structure
      ansible.builtin.assert:
        that:
          - playbook_content is defined
          - playbook_content | length > 0
          - "'- name:' in playbook_content or '---' in playbook_content"
        fail_msg: "Generated playbook is invalid or empty"

    - name: Display generation results
      ansible.builtin.debug:
        msg:
          - "Code Assistant Playbook Generation:"
          - "Status: {{ 'Success' if lightspeed_response.status == 200 else 'Failed' }}"
          - "Playbook Length: {{ playbook_content | length }} chars"

    - name: Generate playbook filename
      ansible.builtin.set_fact:
        playbook_filename: "{{ event_type }}_{{ target_host | regex_replace('\\.', '_') }}.yml"

    - name: Clone git repository to temp directory
      ansible.builtin.git:
        repo: "https://{{ git_username }}:{{ git_token }}@{{ git_remote_url | regex_replace('https://', '') }}"
        dest: "{{ temp_clone_dir }}"
        version: "{{ git_branch }}"
        force: true
      when: git_token | length > 0
      no_log: true  # Don't log the token

    - name: Create playbooks directory in cloned repo
      ansible.builtin.file:
        path: "{{ temp_clone_dir }}/playbooks"
        state: directory
        mode: '0755'
      when: git_token | length > 0

    - name: Save generated playbook to cloned repo
      ansible.builtin.copy:
        content: "{{ playbook_content }}"
        dest: "{{ temp_clone_dir }}/playbooks/{{ playbook_filename }}"
        mode: '0644'
      when: git_token | length > 0

    - name: Configure git user in cloned repo
      ansible.builtin.command:
        cmd: "git config user.name '{{ git_username }}'"
        chdir: "{{ temp_clone_dir }}"
      changed_when: false
      when: git_token | length > 0

    - name: Configure git email in cloned repo
      ansible.builtin.command:
        cmd: "git config user.email '{{ git_email }}'"
        chdir: "{{ temp_clone_dir }}"
      changed_when: false
      when: git_token | length > 0

    - name: Add playbook to git
      ansible.builtin.command:
        cmd: "git add playbooks/{{ playbook_filename }}"
        chdir: "{{ temp_clone_dir }}"
      register: git_add
      changed_when: true
      when: git_token | length > 0

    - name: Commit playbook
      ansible.builtin.command:
        cmd: >
          git commit -m "Add AI-generated playbook: {{ playbook_filename }}"
          -m "Event: {{ event_type }}"
          -m "Host: {{ target_host }}"
          -m "Generated by Red Hat Automation Code Assistant"
        chdir: "{{ temp_clone_dir }}"
      register: git_commit
      changed_when: "'nothing to commit' not in git_commit.stdout"
      failed_when:
        - git_commit.rc != 0
        - "'nothing to commit' not in git_commit.stdout"
      when: git_token | length > 0

    - name: Push to Git repository
      ansible.builtin.command:
        cmd: "git push origin {{ git_branch }}"
        chdir: "{{ temp_clone_dir }}"
      when:
        - git_token | length > 0
        - git_commit.changed
      register: git_push

    - name: Display Git push result
      ansible.builtin.debug:
        msg: "✅ Playbook pushed to Git successfully!"
      when:
        - git_token | length > 0
        - git_push.changed

    # - name: Save playbook locally as backup
    #   ansible.builtin.copy:
    #     content: "{{ playbook_content }}"
    #     dest: "./generated-playbooks/playbooks/{{ playbook_filename }}"
    #     mode: '0644'
    #   when: git_token | length == 0

    - name: Clean up temp clone directory
      ansible.builtin.file:
        path: "{{ temp_clone_dir }}"
        state: absent
      when: git_token | length > 0

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "✅ Workflow Complete!"
          - "=========================================="
          - "Generated Playbook: {{ playbook_filename }}"
          - "Event: {{ event_type }}"
          - "Host: {{ target_host }}"
          # Note: Code Assistant doesn't return confidence/model metadata like Maya did
          - "Git Status: {{ 'Pushed to ' + git_remote_url if (git_token | length > 0 and git_push.changed) else 'Local only (set GIT_TOKEN to push)' }}"
          - "=========================================="
