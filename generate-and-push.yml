---
- name: Generate Playbook with Ansible Maya and Push to Git
  hosts: localhost
  gather_facts: false

  vars:
    # Ansible Maya API
    maya_api_url: "http://localhost:8000/api/v1/events/generate"

    # Event details
    event_type: "disk_full"
    event_description: "Disk usage at 95% on /var/log partition"
    target_host: "web-server-01.example.com"
    event_severity: "high"

    # Git configuration
    git_repo_path: "/home/gmadappa/ansible/ansible-aiops/generated-playbooks"
    git_remote_url: "https://github.com/iamgini/ansible-ai-generated-playbooks"
    git_token: "{{ lookup('env', 'GIT_TOKEN') }}"  # Read from environment variable
    git_username: "iamgini"
    git_email: "net.gini@gmail.com"

    # Output
    playbook_output_dir: "{{ git_repo_path }}/playbooks"

  tasks:
    - name: Call Ansible Maya API to generate playbook
      ansible.builtin.uri:
        url: "{{ maya_api_url }}"
        method: POST
        body_format: json
        body:
          event_type: "{{ event_type }}"
          description: "{{ event_description }}"
          host: "{{ target_host }}"
          severity: "{{ event_severity }}"
        return_content: true
        status_code: 200
        timeout: 120
      register: maya_response

    - name: Display generation metadata
      ansible.builtin.debug:
        msg:
          - "Event ID: {{ maya_response.json.event_id }}"
          - "Confidence: {{ maya_response.json.confidence_score * 100 }}%"
          - "Model: {{ maya_response.json.generation_metadata.model }}"
          - "Tokens: {{ maya_response.json.generation_metadata.tokens_used }}"
          - "Validation: {{ 'Passed' if maya_response.json.validation_passed else 'Failed' }}"

    - name: Create output directory
      ansible.builtin.file:
        path: "{{ playbook_output_dir }}"
        state: directory
        mode: '0755'

    - name: Generate playbook filename
      ansible.builtin.set_fact:
        playbook_filename: "{{ event_type }}_{{ target_host | regex_replace('\\.', '_') }}.yml"
        playbook_full_path: "{{ playbook_output_dir }}/{{ event_type }}_{{ target_host | regex_replace('\\.', '_') }}.yml"

    - name: Save generated playbook to file
      ansible.builtin.copy:
        content: "{{ maya_response.json.playbook }}"
        dest: "{{ playbook_full_path }}"
        mode: '0644'

    - name: Display saved playbook path
      ansible.builtin.debug:
        msg: "Playbook saved to: {{ playbook_full_path }}"

    - name: Initialize git repository if needed
      ansible.builtin.command:
        cmd: git init
        chdir: "{{ git_repo_path }}"
      register: git_init
      failed_when: false
      changed_when: "'Initialized' in git_init.stdout or 'Reinitialized' in git_init.stdout"

    - name: Configure git user
      ansible.builtin.command:
        cmd: "git config user.name '{{ git_username }}'"
        chdir: "{{ git_repo_path }}"
      changed_when: false

    - name: Configure git email
      ansible.builtin.command:
        cmd: "git config user.email '{{ git_email }}'"
        chdir: "{{ git_repo_path }}"
      changed_when: false

    - name: Add remote if not exists
      ansible.builtin.shell: |
        if ! git remote get-url origin >/dev/null 2>&1; then
          git remote add origin {{ git_remote_url }}
        fi
      args:
        chdir: "{{ git_repo_path }}"
      changed_when: false
      when: git_token | length > 0

    - name: Add playbook to git
      ansible.builtin.command:
        cmd: "git add {{ playbook_filename }}"
        chdir: "{{ playbook_output_dir }}"
      register: git_add
      changed_when: true

    - name: Commit playbook
      ansible.builtin.command:
        cmd: >
          git commit -m "Add AI-generated playbook: {{ playbook_filename }}"
          -m "Event: {{ event_type }}"
          -m "Host: {{ target_host }}"
          -m "Confidence: {{ maya_response.json.confidence_score * 100 }}%"
          -m "Generated by Ansible Maya with {{ maya_response.json.generation_metadata.model }}"
        chdir: "{{ git_repo_path }}"
      register: git_commit
      changed_when: "'nothing to commit' not in git_commit.stdout"
      failed_when:
        - git_commit.rc != 0
        - "'nothing to commit' not in git_commit.stdout"

    - name: Ensure main branch exists
      ansible.builtin.command:
        cmd: git branch -M main
        chdir: "{{ git_repo_path }}"
      when: git_commit.changed
      changed_when: false

    - name: Pull remote changes before push
      ansible.builtin.shell: |
        git pull https://{{ git_username }}:{{ lookup('env', 'GIT_TOKEN') }}@{{ git_remote_url | regex_replace('https://', '') }} main --rebase --allow-unrelated-histories
      args:
        chdir: "{{ git_repo_path }}"
      when:
        - git_token | length > 0
        - git_commit.changed
      register: git_pull
      failed_when: false
      changed_when: false

    - name: Push to Git repository
      ansible.builtin.shell: |
        git push https://{{ git_username }}:{{ lookup('env', 'GIT_TOKEN') }}@{{ git_remote_url | regex_replace('https://', '') }} main
      args:
        chdir: "{{ git_repo_path }}"
      when:
        - git_token | length > 0
        - git_commit.changed
      # no_log: true  # Don't log the token
      register: git_push

    - name: Display Git push result
      ansible.builtin.debug:
        msg: "✅ Playbook pushed to Git successfully!"
      when: git_push.changed

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "✅ Workflow Complete!"
          - "=========================================="
          - "Generated Playbook: {{ playbook_filename }}"
          - "Location: {{ playbook_full_path }}"
          - "Confidence: {{ maya_response.json.confidence_score * 100 }}%"
          - "Git Status: {{ 'Pushed' if git_push.changed else 'Local only (no git push)' }}"
          - "=========================================="
