---
- name: Generate Playbook with Ansible Maya and Push to Git
  hosts: localhost
  gather_facts: false

  vars:
    # Ansible Maya API
    maya_api_url: "http://localhost:8000/api/v1/events/generate"

    # Event details
    # event_type: "disk_full"
    # event_description: "Disk usage at 95% on /var/log partition"
    # target_host: "web-server-01.example.com"
    # event_severity: "high"

    # Event details #2 sample
    event_type: "nginx service stopped"
    event_description: "Nginx service not working"
    target_host: "web-server-02.example.com"
    event_severity: "high"

    # Git configuration
    git_remote_url: "https://github.com/your_username/your-ai-generated-playbooks-repo"
    git_token: "{{ lookup('env', 'GIT_TOKEN') }}"
    git_username: "{{ lookup('env', 'GIT_USERNAME') | default('your_github_username', true) }}"
    git_email: "{{ lookup('env', 'GIT_EMAIL') | default('your_email@example.com', true) }}"
    git_branch: "main"  # or create dynamic branch: "ai-{{ event_type }}-{{ run_id }}"

  tasks:
    - name: Generate unique run ID for temp directory
      ansible.builtin.set_fact:
        run_id: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"
      run_once: true

    - name: Set temp clone directory path
      ansible.builtin.set_fact:
        temp_clone_dir: "/tmp/ansible-maya-git-{{ run_id }}"
    - name: Call Ansible Maya API to generate playbook
      ansible.builtin.uri:
        url: "{{ maya_api_url }}"
        method: POST
        body_format: json
        body:
          event_type: "{{ event_type }}"
          description: "{{ event_description }}"
          host: "{{ target_host }}"
          severity: "{{ event_severity }}"
        return_content: true
        status_code: 200
        timeout: 120
      register: maya_response

    - name: Display generation metadata
      ansible.builtin.debug:
        msg:
          - "Event ID: {{ maya_response.json.event_id }}"
          - "Confidence: {{ maya_response.json.confidence_score * 100 }}%"
          - "Model: {{ maya_response.json.generation_metadata.model }}"
          - "Tokens: {{ maya_response.json.generation_metadata.tokens_used }}"
          - "Validation: {{ 'Passed' if maya_response.json.validation_passed else 'Failed' }}"

    - name: Generate playbook filename
      ansible.builtin.set_fact:
        playbook_filename: "{{ event_type }}_{{ target_host | regex_replace('\\.', '_') }}.yml"

    - name: Clone git repository to temp directory
      ansible.builtin.git:
        repo: "https://{{ git_username }}:{{ git_token }}@{{ git_remote_url | regex_replace('https://', '') }}"
        dest: "{{ temp_clone_dir }}"
        version: "{{ git_branch }}"
        force: true
      when: git_token | length > 0
      no_log: true  # Don't log the token

    - name: Create playbooks directory in cloned repo
      ansible.builtin.file:
        path: "{{ temp_clone_dir }}/playbooks"
        state: directory
        mode: '0755'
      when: git_token | length > 0

    - name: Save generated playbook to cloned repo
      ansible.builtin.copy:
        content: "{{ maya_response.json.playbook }}"
        dest: "{{ temp_clone_dir }}/playbooks/{{ playbook_filename }}"
        mode: '0644'
      when: git_token | length > 0

    - name: Configure git user in cloned repo
      ansible.builtin.command:
        cmd: "git config user.name '{{ git_username }}'"
        chdir: "{{ temp_clone_dir }}"
      changed_when: false
      when: git_token | length > 0

    - name: Configure git email in cloned repo
      ansible.builtin.command:
        cmd: "git config user.email '{{ git_email }}'"
        chdir: "{{ temp_clone_dir }}"
      changed_when: false
      when: git_token | length > 0

    - name: Add playbook to git
      ansible.builtin.command:
        cmd: "git add playbooks/{{ playbook_filename }}"
        chdir: "{{ temp_clone_dir }}"
      register: git_add
      changed_when: true
      when: git_token | length > 0

    - name: Commit playbook
      ansible.builtin.command:
        cmd: >
          git commit -m "Add AI-generated playbook: {{ playbook_filename }}"
          -m "Event: {{ event_type }}"
          -m "Host: {{ target_host }}"
          -m "Confidence: {{ maya_response.json.confidence_score * 100 }}%"
          -m "Model: {{ maya_response.json.generation_metadata.model }}"
          -m "Generated by Ansible Maya"
        chdir: "{{ temp_clone_dir }}"
      register: git_commit
      changed_when: "'nothing to commit' not in git_commit.stdout"
      failed_when:
        - git_commit.rc != 0
        - "'nothing to commit' not in git_commit.stdout"
      when: git_token | length > 0

    - name: Push to Git repository
      ansible.builtin.command:
        cmd: "git push origin {{ git_branch }}"
        chdir: "{{ temp_clone_dir }}"
      when:
        - git_token | length > 0
        - git_commit.changed
      register: git_push

    - name: Display Git push result
      ansible.builtin.debug:
        msg: "✅ Playbook pushed to Git successfully!"
      when:
        - git_token | length > 0
        - git_push.changed

    # - name: Save playbook locally as backup
    #   ansible.builtin.copy:
    #     content: "{{ maya_response.json.playbook }}"
    #     dest: "./generated-playbooks/playbooks/{{ playbook_filename }}"
    #     mode: '0644'
    #   when: git_token | length == 0

    - name: Clean up temp clone directory
      ansible.builtin.file:
        path: "{{ temp_clone_dir }}"
        state: absent
      when: git_token | length > 0

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "✅ Workflow Complete!"
          - "=========================================="
          - "Generated Playbook: {{ playbook_filename }}"
          - "Event: {{ event_type }}"
          - "Host: {{ target_host }}"
          - "Confidence: {{ maya_response.json.confidence_score * 100 }}%"
          - "Model: {{ maya_response.json.generation_metadata.model }}"
          - "Validation: {{ 'Passed ✓' if maya_response.json.validation_passed else 'Failed ✗' }}"
          - "Git Status: {{ 'Pushed to ' + git_remote_url if (git_token | length > 0 and git_push.changed) else 'Local only (set GIT_TOKEN to push)' }}"
          - "=========================================="
