---
# Ansible Collection Requirements for AIOps Execution Environment

collections:
  # Event-Driven Automation (Required for rulebooks)
  - name: ansible.eda
    version: ">=1.0.0"

  # Model Context Protocol Client (Required for MCP integration)
  - name: ansible.mcp
    version: ">=1.0.0"

  # Ansible Utilities (Dependency of ansible.mcp)
  - name: ansible.utils
    version: ">=2.0.0"

  # AAP Controller (Required for MCP and configuration)
  - name: ansible.controller
    version: ">=4.5.0"

  # AWX/AAP Job Launching (Required for launching templates)
  - name: awx.awx
    version: ">=23.0.0"

  # Platform Integration (Optional)
  - name: ansible.platform
    version: ">=1.0.0"
