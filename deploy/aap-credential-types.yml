---
# Custom Credential Types for AIOps in AAP
#
# Deploy using:
#   ansible-navigator run deploy/aap-credential-types.yml -m stdout \
#     -e "controller_host=https://aap.example.com" \
#     -e "controller_username=admin" \
#     -e "controller_password=secret"
#
# Or apply via CaC with infra.aap_configuration

- name: Create AIOps Custom Credential Types in AAP
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    controller_host: "{{ lookup('env', 'CONTROLLER_HOST') }}"
    controller_username: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
    controller_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
    controller_verify_ssl: false
    aap_organization: "Default"

  tasks:
    # =======================================================================
    # Credential Type 1: MCP Bearer Token
    # =======================================================================
    - name: Create MCP Bearer Token credential type
      ansible.controller.credential_type:
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
        name: "AIOps - MCP Bearer Token"
        kind: cloud
        inputs:
          fields:
            - id: mcp_bearer_token
              type: string
              label: "MCP Bearer Token"
              secret: true
              help_text: "Bearer token for authenticating to the AAP MCP server"
            - id: mcp_server_url
              type: string
              label: "MCP Server URL"
              help_text: "URL of the AAP MCP server (e.g., https://aap.example.com:8448)"
          required:
            - mcp_bearer_token
            - mcp_server_url
        injectors:
          env:
            MCP_BEARER_TOKEN: "{% raw %}{{ mcp_bearer_token }}{% endraw %}"
            AAP_MCP_SERVER_URL: "{% raw %}{{ mcp_server_url }}{% endraw %}"
        state: present

    # =======================================================================
    # Credential Type 2: Generic AI API
    # =======================================================================
    - name: Create Generic AI API credential type
      ansible.controller.credential_type:
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
        name: "AIOps - Generic AI API"
        kind: cloud
        inputs:
          fields:
            - id: generic_ai_api_token
              type: string
              label: "AI API Token"
              secret: true
              help_text: "Bearer token for the AI API (OpenAI, Azure OpenAI, vLLM, etc.)"
            - id: generic_ai_api_url
              type: string
              label: "AI API URL"
              help_text: "OpenAI-compatible chat completions endpoint URL"
            - id: generic_api_model
              type: string
              label: "AI Model"
              default: "gpt-4"
              help_text: "Model name to use (e.g., gpt-4, gpt-4o, llama3, mistral)"
          required:
            - generic_ai_api_token
            - generic_ai_api_url
        injectors:
          env:
            GENERIC_AI_API_TOKEN: "{% raw %}{{ generic_ai_api_token }}{% endraw %}"
            GENERIC_AI_API_URL: "{% raw %}{{ generic_ai_api_url }}{% endraw %}"
            GENERIC_API_MODEL: "{% raw %}{{ generic_api_model }}{% endraw %}"
        state: present

    # =======================================================================
    # Credential Type 3: Git Token (for AI-generated playbook push)
    # =======================================================================
    - name: Create Git Token credential type
      ansible.controller.credential_type:
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
        name: "AIOps - Git Token"
        kind: cloud
        inputs:
          fields:
            - id: git_token
              type: string
              label: "Git Personal Access Token"
              secret: true
              help_text: "PAT for pushing AI-generated playbooks to the repository"
            - id: git_remote_url
              type: string
              label: "Git Remote URL"
              help_text: "HTTPS URL of the target git repository"
            - id: git_username
              type: string
              label: "Git Username"
              default: "aiops-bot"
            - id: git_email
              type: string
              label: "Git Email"
              default: "aiops@example.com"
          required:
            - git_token
            - git_remote_url
        injectors:
          env:
            GIT_TOKEN: "{% raw %}{{ git_token }}{% endraw %}"
            GIT_REMOTE_URL: "{% raw %}{{ git_remote_url }}{% endraw %}"
            GIT_USERNAME: "{% raw %}{{ git_username }}{% endraw %}"
            GIT_EMAIL: "{% raw %}{{ git_email }}{% endraw %}"
        state: present

    - name: Credential types created
      ansible.builtin.debug:
        msg: >-
          Created 3 custom credential types:
          1. AIOps - MCP Bearer Token (MCP_BEARER_TOKEN, AAP_MCP_SERVER_URL)
          2. AIOps - Generic AI API (GENERIC_AI_API_TOKEN, GENERIC_AI_API_URL, GENERIC_API_MODEL)
          3. AIOps - Git Token (GIT_TOKEN, GIT_REMOTE_URL, GIT_USERNAME, GIT_EMAIL)
          → Next: Create credential instances and attach to job templates
